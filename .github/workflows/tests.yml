name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '11.1.1'
          run_install: false

      - name: Setup Application
        run: composer setup

      - name: Setup PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes qpdf

          chrome_path="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$chrome_path" || ! -x "$chrome_path" ]]; then
            echo "Chrome/Chromium executable was not found." >&2
            exit 1
          fi

          "$chrome_path" --version
          printf 'BROWSERSHOT_CHROME_PATH=%s\n' "$chrome_path" >> "$GITHUB_ENV"
          command -v qpdf
          qpdf --version

      - name: Run CI Checks
        run: composer ci:check
